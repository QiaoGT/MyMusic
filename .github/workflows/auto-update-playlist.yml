name: Auto Update Playlist

on:
  push:
    branches: [ "main" ]
    paths:
      - "mus/**"
      - "lrc/**"
      - "img/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate playlist.json
        run: python scripts/generate_playlist.py

      - name: Commit changes
        run: |
          if git diff --quiet playlist.json; then
            echo "No playlist changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.json
          git commit -m "chore: auto update playlist.json"
          git push
