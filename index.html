<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyMusic Neon Player</title>
  <link rel="icon" href="/favicon.ico?v=20260508" sizes="any" />
  <link rel="shortcut icon" href="/favicon.ico?v=20260508" />
  <link rel="apple-touch-icon" href="/favicon.ico?v=20260508" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="noise"></div>
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>

  <div class="layout">
    <aside class="panel left">
      <div class="brand">MYMUSIC</div>
      <img id="cover" class="cover" alt="cover" />
      <h1 id="title">等待播放</h1>
      <p id="artist"></p>

      <div class="side-controls">
        <div class="mini-timeline">
          <span id="mini-now">00:00</span>
          <input id="mini-progress" type="range" min="0" max="100" step="0.1" value="0" />
          <span id="mini-total">00:00</span>
        </div>
        <button id="mode" class="icon" data-tip="顺序">🔁</button>
        <button id="prev" class="icon" data-tip="上一首">⏮</button>
        <button id="play" class="icon primary" data-tip="播放">▶</button>
        <button id="next" class="icon" data-tip="下一首">⏭</button>
        <button id="export-video" class="icon" data-tip="一键下载视频 (ALT+B)">⬇</button>
      </div>
    </aside>

    <main class="panel center" id="lyrics-stage">
      <button id="btn-full" class="icon" data-tip="歌词全屏" aria-label="歌词全屏">⛶</button>
      <button id="btn-lyric-settings" class="icon lyric-settings" data-tip="歌词设置" aria-label="歌词设置">⚙</button>
      <div class="lyrics-mask">
        <div id="lyrics"><p>正在加载歌曲...</p></div>
      </div>
      <canvas id="fullscreen-spectrum" height="82"></canvas>
    </main>

    <aside class="panel right">
      <div class="right-head">
        <strong>播放列表</strong>
        <span id="count">0</span>
      </div>
      <ul id="list"></ul>
    </aside>

    <footer class="panel bottom">
      <canvas id="spectrum" height="64"></canvas>

      <div class="controls">
        <label class="vol">Vol<input id="volume" type="range" min="0" max="1" step="0.01" value="1" /></label>
      </div>

      <p id="status">准备就绪</p>
    </footer>
  </div>

  <div id="lyric-modal" class="modal hidden">
    <div class="modal-card">
      <h3>歌词颜色设置</h3>
      <label class="color-label" for="lyric-text-color">当前句字体颜色</label>
      <input id="lyric-text-color" type="color" value="#ffffff" />
      <label class="color-label" for="lyric-fill-color">逐字高亮颜色</label>
      <input id="lyric-fill-color" type="color" value="#5aa2ff" />
      <div class="modal-actions">
        <button id="lyric-save" class="icon text-btn">保存</button>
        <button id="lyric-cancel" class="icon text-btn">取消</button>
      </div>
    </div>
  </div>

  <div id="auth-overlay" class="auth-overlay hidden">
    <div class="auth-card">
      <h3>请输入访问密码</h3>
      <input id="auth-input" type="password" placeholder="Password" />
      <button id="auth-submit" class="icon text-btn">进入</button>
      <p id="auth-msg"></p>
    </div>
  </div>

  <audio id="audio" preload="metadata"></audio>
  <script src="vendor/ffmpeg.min.js"></script>
  <script src="vendor/html2canvas.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
