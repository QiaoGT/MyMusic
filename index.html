<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyMusic Neon Player</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="noise"></div>
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>

  <div class="layout">
    <aside class="panel left">
      <div class="brand">MYMUSIC</div>
      <img id="cover" class="cover" alt="cover" />
      <h1 id="title">等待播放</h1>
      <p id="artist">Personal Radio</p>

      <div class="font-box">
        <label for="font-select">歌词字体</label>
        <select id="font-select"></select>
        <input id="font-custom" type="text" placeholder="输入字体名并应用" />
        <button id="font-apply">应用字体</button>
      </div>
    </aside>

    <main class="panel center" id="lyrics-stage">
      <button id="btn-full" class="icon" data-tip="歌词全屏" aria-label="歌词全屏">⛶</button>
      <div class="lyrics-mask">
        <div id="lyrics"><p>正在加载歌曲...</p></div>
      </div>
    </main>

    <aside class="panel right">
      <div class="right-head">
        <strong>Playlist</strong>
        <span id="count">0</span>
      </div>
      <ul id="list"></ul>
    </aside>

    <footer class="panel bottom">
      <canvas id="spectrum" height="64"></canvas>

      <div class="timeline">
        <span id="now">00:00</span>
        <input id="progress" type="range" min="0" max="100" step="0.1" value="0" />
        <span id="total">00:00</span>
      </div>

      <div class="controls">
        <button id="mode" class="icon" data-tip="顺序">🔁</button>
        <button id="prev" class="icon" data-tip="上一首">⏮</button>
        <button id="play" class="icon primary" data-tip="播放">▶</button>
        <button id="next" class="icon" data-tip="下一首">⏭</button>
        <label class="vol">Vol<input id="volume" type="range" min="0" max="1" step="0.01" value="1" /></label>
      </div>

      <p id="status">准备就绪</p>
    </footer>
  </div>

  <audio id="audio" preload="metadata"></audio>
  <script src="script.js"></script>
</body>
</html>
