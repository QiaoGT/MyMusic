<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyMusic - 个人原创音乐</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div class="background-blur" id="bg-blur"></div>

    <aside class="sidebar panel">
      <div id="datetime-widget">
        <h1 id="clock-time">00:00</h1>
        <p id="clock-date">2026年5月8日</p>
      </div>
      <p class="hint">上传音频到 GitHub 的 <code>mus/</code> 后，刷新页面即可自动同步。</p>
    </aside>

    <main class="lyrics-container panel">
      <div id="lyric-wrapper">
        <p>正在拉取 GitHub 音乐列表...</p>
      </div>
    </main>

    <section class="playlist-panel panel">
      <div class="now-playing-card">
        <img id="current-cover" src="data:image/svg+xml;charset=UTF-8,%3Csvg xmlns%3D%22http%3A//www.w3.org/2000/svg%22 width%3D%22320%22 height%3D%22320%22 viewBox%3D%220 0 320 320%22%3E%3Cdefs%3E%3ClinearGradient id%3D%22g%22 x1%3D%220%22 y1%3D%220%22 x2%3D%221%22 y2%3D%221%22%3E%3Cstop offset%3D%220%25%22 stop-color%3D%22%231f2937%22/%3E%3Cstop offset%3D%22100%25%22 stop-color%3D%22%23111827%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width%3D%22320%22 height%3D%22320%22 fill%3D%22url(%23g)%22/%3E%3Ccircle cx%3D%22160%22 cy%3D%22160%22 r%3D%2272%22 fill%3D%22%23374151%22/%3E%3Ccircle cx%3D%22160%22 cy%3D%22160%22 r%3D%2218%22 fill%3D%22%239ca3af%22/%3E%3Ctext x%3D%22160%22 y%3D%22280%22 font-size%3D%2222%22 text-anchor%3D%22middle%22 fill%3D%22%23e5e7eb%22 font-family%3D%22Arial%2C sans-serif%22%3EMyMusic%3C/text%3E%3C/svg%3E" alt="Cover">
        <h2 id="current-title">未播放</h2>
        <p id="current-artist">MyMusic 创作</p>
      </div>
      <ul id="music-list"></ul>
    </section>

    <footer class="player-controls panel">
      <input type="range" id="progress-bar" value="0" step="0.1" min="0" max="100">
      <div class="btns">
        <button id="btn-prev" type="button">上一首</button>
        <button id="btn-play" type="button">播放</button>
        <button id="btn-next" type="button">下一首</button>
      </div>
    </footer>
  </div>

  <audio id="audio-element" preload="metadata"></audio>
  <script src="script.js"></script>
</body>
</html>
